<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b1220"
    >

    <title>
        {% block title %}ExamGuard{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        /* =====================================================
           EXAMGUARD GLOBAL APPLICATION SHELL
           ===================================================== */

        :root {
            --eg-navy: #0b1220;
            --eg-navy-light: #111827;
            --eg-indigo: #4f46e5;
            --eg-blue: #2563eb;
            --eg-text: #0f172a;
            --eg-muted: #64748b;
            --eg-border: #e5e7eb;
            --eg-background: #f6f8fc;
            --eg-white: #ffffff;
        }


        * {
            box-sizing: border-box;
        }


        html {
            margin: 0;
            padding: 0;

            min-height: 100%;
        }


        body {
            margin: 0;
            padding: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(99, 102, 241, 0.045),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 100%,
                    rgba(37, 99, 235, 0.04),
                    transparent 30%
                ),
                var(--eg-background);

            color: var(--eg-text);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }


        /* =====================================================
           APPLICATION HEADER
           ===================================================== */

        .eg-navbar {
            position: sticky;

            top: 0;

            z-index: 1000;

            width: 100%;

            height: 72px;

            background:
                rgba(255, 255, 255, 0.94);

            border-bottom:
                1px solid rgba(226, 232, 240, 0.85);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            box-shadow:
                0 4px 18px rgba(15, 23, 42, 0.035);
        }


        .eg-navbar-inner {
            width: 100%;

            max-width: 1240px;

            height: 100%;

            margin: 0 auto;

            padding: 0 28px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        /* =====================================================
           BRAND
           ===================================================== */

        .eg-brand {
            display: flex;

            align-items: center;

            gap: 12px;

            color: var(--eg-text);

            text-decoration: none;

            user-select: none;
        }


        .eg-logo {
            position: relative;

            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    145deg,
                    var(--eg-indigo),
                    var(--eg-blue)
                );

            box-shadow:
                0 7px 18px rgba(79, 70, 229, 0.22);

            overflow: hidden;
        }


        .eg-logo::before {
            content: "";

            position: absolute;

            width: 17px;
            height: 21px;

            top: 8px;

            border: 2px solid rgba(255, 255, 255, 0.95);

            border-radius:
                8px 8px 10px 10px;

            clip-path:
                polygon(
                    50% 0%,
                    92% 15%,
                    88% 63%,
                    50% 100%,
                    12% 63%,
                    8% 15%
                );
        }


        .eg-logo::after {
            content: "";

            position: absolute;

            width: 7px;
            height: 4px;

            top: 16px;

            border-left: 2px solid white;
            border-bottom: 2px solid white;

            transform: rotate(-45deg);
        }


        .eg-brand-text {
            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .eg-brand-name {
            font-size: 17px;

            line-height: 1.1;

            font-weight: 750;

            letter-spacing: -0.3px;

            color: #111827;
        }


        .eg-brand-subtitle {
            margin-top: 3px;

            font-size: 9px;

            line-height: 1;

            font-weight: 650;

            letter-spacing: 1.15px;

            text-transform: uppercase;

            color: #94a3b8;
        }


        /* =====================================================
           NAVIGATION
           ===================================================== */

        .eg-navbar-links {
            display: flex;

            align-items: center;

            gap: 8px;
        }


        .eg-navbar-links a {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 38px;

            padding: 0 16px;

            border-radius: 9px;

            color: #475569;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }


        .eg-navbar-links a:hover {
            background: #f1f5f9;

            color: #1e293b;

            transform: translateY(-1px);
        }


        /* Primary navigation action */

        .eg-navbar-links a.eg-nav-primary {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    var(--eg-indigo),
                    var(--eg-blue)
                );

            box-shadow:
                0 6px 16px rgba(79, 70, 229, 0.18);
        }


        .eg-navbar-links a.eg-nav-primary:hover {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #4338ca,
                    #1d4ed8
                );

            box-shadow:
                0 8px 20px rgba(79, 70, 229, 0.25);
        }


        /* =====================================================
           MAIN CONTENT
           ===================================================== */

        main {
            width: 100%;

            min-height:
                calc(100vh - 72px);
        }


        .page {
            width: 100%;

            max-width: 1240px;

            margin: 0 auto;

            padding: 42px 28px 70px;
        }


        .page-narrow {
            width: 100%;

            max-width: 1240px;

            margin: 0 auto;

            padding: 42px 28px 70px;
        }


        /* =====================================================
           LINKS
           ===================================================== */

        a {
            color: var(--eg-indigo);
        }


        /* =====================================================
           SELECTION
           ===================================================== */

        ::selection {
            background: rgba(99, 102, 241, 0.18);

            color: #111827;
        }


        /* =====================================================
           SCROLLBAR
           ===================================================== */

        ::-webkit-scrollbar {
            width: 9px;
        }


        ::-webkit-scrollbar-track {
            background: #f8fafc;
        }


        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;

            border-radius: 20px;

            border: 2px solid #f8fafc;
        }


        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            .eg-navbar {
                height: 64px;
            }


            .eg-navbar-inner {
                padding: 0 17px;
            }


            .eg-logo {
                width: 34px;
                height: 34px;

                border-radius: 9px;
            }


            .eg-brand-name {
                font-size: 15px;
            }


            .eg-brand-subtitle {
                display: none;
            }


            .eg-navbar-links {
                gap: 4px;
            }


            .eg-navbar-links a {
                min-height: 34px;

                padding: 0 11px;

                font-size: 12px;
            }


            .page,
            .page-narrow {
                padding:
                    25px
                    17px
                    50px;
            }
        }


        /* =====================================================
           VERY SMALL SCREENS
           ===================================================== */

        @media (max-width: 420px) {

            .eg-brand-text {
                display: none;
            }


            .eg-navbar-inner {
                justify-content: space-between;
            }


            .eg-navbar-links a {
                padding: 0 9px;
            }
        }


        /* =====================================================
           ACCESSIBILITY
           ===================================================== */

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid rgba(99, 102, 241, 0.22);

            outline-offset: 2px;
        }


        /* =====================================================
           REDUCED MOTION
           ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;

                transition-duration: 0.01ms !important;

                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         EXAMGUARD APPLICATION HEADER
         ===================================================== -->

    <header class="eg-navbar">

        <div class="eg-navbar-inner">


            <!-- BRAND -->

            <a
                href="{{ url_for('login') }}"
                class="eg-brand"
                aria-label="ExamGuard"
            >

                <span
                    class="eg-logo"
                    aria-hidden="true"
                ></span>


                <span class="eg-brand-text">

                    <span class="eg-brand-name">
                        ExamGuard
                    </span>

                    <span class="eg-brand-subtitle">
                        Secure Examination Platform
                    </span>

                </span>

            </a>


            <!-- NAVIGATION -->

            <nav
                class="eg-navbar-links"
                aria-label="Main navigation"
            >

                {% block nav_links %}{% endblock %}

            </nav>


        </div>

    </header>


    <!-- =====================================================
         PAGE CONTENT
         ===================================================== -->

    <main class="{% block main_class %}page{% endblock %}">

        {% block content %}{% endblock %}

    </main>


    <!-- =====================================================
         PAGE-SPECIFIC SCRIPTS
         ===================================================== -->

    {% block content_scripts %}{% endblock %}


</body>

</html>
